<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
            color: #172033;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 36px;
            box-shadow: 0 8px 30px rgba(16, 24, 40, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo h1 {
            margin: 0 0 8px;
            font-size: 26px;
            font-weight: 700;
        }

        .logo p {
            margin: 0;
            color: #667085;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .login-btn {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error-message {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            font-size: 14px;
        }
        .password-field {
    position: relative;
    width: 100%;
}

.password-field input {
    width: 100%;
    height: 46px;
    padding: 0 48px 0 13px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background: #ffffff;
}

.password-field input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
}

/* Eye button */
.password-field .show-password {
    position: absolute !important;

    top: 50% !important;
    right: 10px !important;

    transform: translateY(-50%) !important;

    width: 30px !important;
    height: 30px !important;

    padding: 0 !important;
    margin: 0 !important;

    border: 0 !important;
    outline: none !important;

    background: transparent !important;
    box-shadow: none !important;

    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    cursor: pointer;
    color: #667085;
}

.password-field .show-password:hover {
    color: #2563eb;
}

.password-field .show-password svg {
    width: 19px;
    height: 19px;
    display: block;
}

.password-field .show-password svg path,
.password-field .show-password svg circle {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <h1>Lead Management System</h1>
            <p>Sign in to your account</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="error-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autofocus
                >
            </div>

         <div class="form-group">
    <label for="password">Password</label>

    <div class="password-field">
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
            aria-label="Show password"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </button>
    </div>
</div>
            <button type="submit" class="login-btn">
                Sign In
            </button>

            <div style="text-align: right; margin-top: 12px;">
    <a href="{% url 'password_reset' %}"
       style="font-size: 14px; color: #2563eb; text-decoration: none;">
        Forgot Password?
    </a>
</div>

        </form>

    </div>

</div>
<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".show-password");

    if (password.type === "password") {
        password.type = "text";

        button.innerHTML = `
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.7A10.8 10.8 0 0 1 12 5.5
                         c6 0 9.5 6.5 9.5 6.5
                         a18 18 0 0 1-3.1 3.8"/>
                <path d="M6.1 8.2A17.7 17.7 0 0 0 2.5 12
                         S6 18.5 12 18.5
                         c1.1 0 2.1-.2 3-.5"/>
            </svg>
        `;

        button.setAttribute("aria-label", "Hide password");

    } else {
        password.type = "password";

        button.innerHTML = `
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.5-6.5 9.5-6.5
                         9.5 6.5 9.5 6.5
                         -3.5 6.5-9.5 6.5
                         S2.5 12 2.5 12Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        `;

        button.setAttribute("aria-label", "Show password");
    }
}
</script>
</body>
</html>
